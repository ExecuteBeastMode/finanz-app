<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Finanzen</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#f2f4f8;--mut:#8b93a3;--in:#2ecc71;--out:#ff5a6a;--acc:#6c8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ic{background:var(--card);width:40px;height:40px;border-radius:12px;font-size:18px}
.bal{background:linear-gradient(135deg,#2b3a8f,#6c8cff);border-radius:20px;padding:20px;margin-bottom:12px}
.bal small{opacity:.8}.bal b{display:block;font-size:34px;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.box{background:var(--card);border-radius:16px;padding:14px}
.box small{color:var(--mut)}.box b{display:block;font-size:20px;margin-top:2px}
.in{color:var(--in)}.out{color:var(--out)}
h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.bar{margin:8px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--acc);border-radius:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.item .d{flex:1;min-width:0}.item .d div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mut)}
.item .x{background:none;color:var(--mut);font-size:18px;padding:6px}
.empty{color:var(--mut);text-align:center;padding:24px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--acc);font-size:32px;box-shadow:0 8px 24px #0008}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.sheet form{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:10px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.seg button{background:none;padding:10px;border-radius:9px}
.seg button.on.o{background:var(--out)}.seg button.on.i{background:var(--in);color:#04210f}
.save{background:var(--acc);padding:14px;border-radius:12px;font-weight:600}
.link{background:none;color:var(--mut);padding:10px;width:100%}
</style></head><body>
<main>
<div class="nav"><button class="ic" id="prev">‹</button><h1 id="mon"></h1><button class="ic" id="next">›</button></div>
<div class="bal"><small>Saldo</small><b id="bal"></b></div>
<div class="row2"><div class="box"><small>Einnahmen</small><b class="in" id="inc"></b></div><div class="box"><small>Ausgaben</small><b class="out" id="exp"></b></div></div>
<h2>Ausgaben nach Kategorie</h2><div id="cats"></div>
<h2>Buchungen</h2><div id="list"></div>
<button class="link" id="csv">Als CSV exportieren</button>
</main>
<button class="fab" id="add" aria-label="Neue Buchung">+</button>
<div class="sheet" id="sheet"><form id="f">
<div class="seg"><button type="button" class="o on" id="bo">Ausgabe</button><button type="button" class="i" id="bi">Einnahme</button></div>
<input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Betrag in €" required>
<select id="cat"></select>
<input id="date" type="date" required>
<input id="note" placeholder="Notiz (optional)">
<button class="save">Speichern</button><button type="button" class="link" id="cancel">Abbrechen</button>
</form></div>
<script>
const K='finanz.v1',$=id=>document.getElementById(id);
const C={out:['Essen','Miete','Auto','Freizeit','Shopping','Fitness','Abos','Sonstiges'],in:['Gehalt','Nebenjob','Geschenk','Sonstiges']};
let tx=JSON.parse(localStorage.getItem(K)||'[]'),m=new Date(),type='out';m.setDate(1);
const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const save=()=>localStorage.setItem(K,JSON.stringify(tx));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const ym=m.toISOString().slice(0,7);
 $('mon').textContent=m.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
 const t=tx.filter(x=>x.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const i=t.filter(x=>x.type=='in').reduce((s,x)=>s+x.amt,0),o=t.filter(x=>x.type=='out').reduce((s,x)=>s+x.amt,0);
 $('inc').textContent=eur(i);$('exp').textContent=eur(o);$('bal').textContent=eur(i-o);
 const g={};t.filter(x=>x.type=='out').forEach(x=>g[x.cat]=(g[x.cat]||0)+x.amt);
 const e=Object.entries(g).sort((a,b)=>b[1]-a[1]);
 $('cats').innerHTML=e.length?e.map(([k,v])=>`<div class="bar"><div><span>${esc(k)}</span><span>${eur(v)}</span></div><div class="track"><div class="fill" style="width:${v/o*100}%"></div></div></div>`).join(''):'<div class="empty">Keine Ausgaben</div>';
 $('list').innerHTML=t.length?t.map(x=>`<div class="item"><div class="d"><div>${esc(x.cat)}${x.note?' · '+esc(x.note):''}</div><small>${new Date(x.date).toLocaleDateString('de-DE')}</small></div><b class="${x.type}">${x.type=='in'?'+':'−'}${eur(x.amt)}</b><button class="x" data-id="${x.id}">✕</button></div>`).join(''):'<div class="empty">Noch keine Buchungen. Tippe auf +</div>';
}
function setType(t){type=t;$('bo').classList.toggle('on',t=='out');$('bi').classList.toggle('on',t=='in');$('cat').innerHTML=C[t].map(c=>`<option>${c}</option>`).join('')}
$('bo').onclick=()=>setType('out');$('bi').onclick=()=>setType('in');
$('add').onclick=()=>{setType('out');$('date').value=new Date().toISOString().slice(0,10);$('sheet').classList.add('on');$('amt').focus()};
$('cancel').onclick=()=>$('sheet').classList.remove('on');
$('f').onsubmit=e=>{e.preventDefault();tx.push({id:Date.now(),type,amt:parseFloat($('amt').value),cat:$('cat').value,date:$('date').value,note:$('note').value.trim()});save();$('f').reset();$('sheet').classList.remove('on');m=new Date($('date').value||Date.now());m.setDate(1);render()};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('Buchung löschen?')){tx=tx.filter(x=>x.id!=id);save();render()}};
$('prev').onclick=()=>{m.setMonth(m.getMonth()-1);render()};$('next').onclick=()=>{m.setMonth(m.getMonth()+1);render()};
$('csv').onclick=()=>{const r=['Datum;Typ;Kategorie;Betrag;Notiz',...tx.map(x=>[x.date,x.type=='in'?'Einnahme':'Ausgabe',x.cat,String(x.amt).replace('.',','),'"'+x.note.replace(/"/g,'""')+'"'].join(';'))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='finanzen.csv';a.click()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
